# Configuration comes from .env (see .env.example). The ${VAR:-default}
# fallbacks mean the stack still runs correctly with no .env file present.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar_dev}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-northstar} -d ${POSTGRES_DB:-northstar}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD:-northstar_dev}@db:5432/${POSTGRES_DB:-northstar}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: ${API_PORT:-3001}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123!}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
